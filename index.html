@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bk);color:var(--wh);font-family:var(--sg);-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px;z-index:5}
#logo{background:none;border:0;color:var(--wh);text-align:center;cursor:pointer;perspective:400px;user-select:none}
.lg{display:block;width:44px;height:44px;margin:auto;perspective:420px}.lg .ro{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:ry 9s linear infinite}.lg b{position:absolute;inset:0;background:center/contain no-repeat;backface-visibility:hidden}.lg .fa{background-image:var(--lf);transform:translateZ(2px)}.lg .fb{background-image:var(--lk);transform:rotateY(180deg) translateZ(2px)}@keyframes ry{to{transform:rotateY(360deg)}}.hr .lg{width:28px;height:28px;margin:0}
#logo small{display:block;font-size:8px;letter-spacing:.3em;margin-top:4px;color:var(--sv)}
@keyframes turn{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
#burger{background:none;border:0;padding:8px;cursor:pointer;opacity:.7}

main{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:22px;padding:120px 20px 160px;text-align:center}
.name{font-size:clamp(34px,11vw,64px);font-weight:700;letter-spacing:.14em;animation:welcome 3s ease-out both}
@keyframes welcome{0%{transform:perspective(700px) scale(.35) rotateY(0);opacity:.25;filter:brightness(.4)}
55%{transform:perspective(700px) scale(.9) rotateY(540deg);opacity:1;filter:brightness(1.3) hue-rotate(40deg)}
78%{transform:perspective(700px) scale(1) rotateY(720deg);text-shadow:0 0 30px #fff,0 0 60px #9b6bff;filter:brightness(2.2)}
100%{transform:perspective(700px) scale(1) rotateY(720deg);text-shadow:0 0 18px #7a4bd655;filter:none}}
.rv{opacity:0;animation:fade 1s 2.8s ease-out forwards}
@keyframes fade{to{opacity:1}}
.hr{width:min(84vw,340px);display:flex;align-items:center;gap:10px}
.hr b{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9b8ff,#3b82f6,#ec4899,transparent);box-shadow:0 0 8px #7a4bd6}
.hr svg{width:16px;height:16px;color:var(--wh)}
.glow{filter:drop-shadow(0 0 9px #7a4bd677)}
.shape{--a:0deg;display:block;width:min(84vw,340px);border:0;padding:2px;cursor:pointer;color:var(--wh);font:600 13px var(--sg);letter-spacing:.2em;background:conic-gradient(from var(--a),#7a4bd6,#e8e6ea,#3b82f6,#ec4899,#ef4444,#7a4bd6);clip-path:polygon(0 22%,50% 0,100% 22%,100% 78%,50% 100%,0 78%);animation:spin 5s linear infinite}
.shape span{display:block;padding:24px 22px;background:var(--bk);clip-path:polygon(0 22%,50% 0,100% 22%,100% 78%,50% 100%,0 78%)}
.shape.sm span{background:#14101c}
@keyframes spin{to{--a:360deg}}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid #9A96A366;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--wh);text-decoration:none;background:#0A0A0D88}
.ic.s{width:38px;height:38px}
.ov{position:fixed;inset:0;z-index:20;background:#0A0A0Df2;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 70px) 22px 110px}
.ov.on{display:block}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;background:none;border:0;color:var(--wh);font-size:30px;cursor:pointer;z-index:30}
.pick{max-width:380px;margin:12vh auto 0;text-align:center}
.pick h3,.menu a{letter-spacing:.2em;font-size:13px;font-weight:600}

.menu{max-width:380px;margin:8vh auto 0}
.menu a{display:block;padding:18px 0;border-bottom:1px solid #9A96A322;color:var(--wh);text-decoration:none;font-size:15px}
.menu a small{color:var(--sv);font-size:10px;margin-left:8px}
.world{max-width:560px;margin:0 auto}
.world h2{font-size:22px;letter-spacing:.14em;margin:38px 0 14px}
.world p{font:400 20px/1.6 var(--cg);margin-bottom:14px;color:#d8d5dc;white-space:pre-wrap}
.world img{width:100%;border-radius:4px;margin:14px 0}
.lk{display:block;padding:14px;border:1px solid #9A96A344;color:var(--wh);text-decoration:none;text-align:center;margin:12px 0;letter-spacing:.14em;font-size:12px}
.empty{color:var(--sv);text-align:center;margin-top:30vh;font-size:13px;letter-spacing:.14em}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:#14101cf5;border-top:1px solid #7a4bd6}

.b.p{background:#7a4bd6;border-color:#7a4bd6}
.b.d{color:#ff8a9a;flex:0 0 auto;padding:8px 10px}

.row{border:1px solid #9A96A322;padding:10px;margin-bottom:10px}
.ctl{display:flex;gap:6px;justify-content:flex-end}
.pw{max-width:300px;margin:22vh auto 0;text-align:center}
.pw input{width:100%;padding:13px;background:#14101c;border:1px solid #9A96A366;color:var(--wh);text-align:center;font:15px var(--sg);margin:18px 0 12px}

#str{width:min(84vw,340px);border-top:1px solid #9A96A333;padding-top:12px}
.icons{gap:6px}
.ic,.ic.s{width:42px;height:42px;border:0!important;background:none!important;border-radius:0;opacity:.9}

.name,.wl{font-family:'Cinzel','Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.12em;background:linear-gradient(180deg,#f7f5fb 0%,#c3bed1 36%,#6c6680 52%,#dcd8e8 70%,#9a8ac4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.name{font-size:clamp(28px,9vw,56px);animation:nm 2.2s ease-out both}
@keyframes nm{0%{transform:perspective(700px) scale(.3) rotateY(0);opacity:.2;filter:brightness(.4)}60%{transform:perspective(700px) scale(.9) rotateY(540deg);opacity:1;filter:brightness(1.2) drop-shadow(0 0 12px #7a4bd6)}100%{transform:perspective(700px) scale(1) rotateY(720deg);opacity:1;filter:brightness(1) drop-shadow(0 0 10px #7a4bd688)}}
.stage{position:relative}

.bolt path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;filter:url(#el) drop-shadow(0 0 6px #9b6bff);animation:strike 1s ease-out both}

.name,.wl{background:linear-gradient(115deg,#3a1780 0%,#6b2bd1 20%,#b453e2 34%,#4560e8 48%,#5a26b8 60%,#8a44e6 72%,#e05fd0 84%,#3a1780 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-text-stroke:1.5px #f4f0fb}
.name::before,.wl::before{color:#7a35c8;-webkit-text-fill-color:#7a35c8;-webkit-text-stroke:1.5px #d6cde8;text-shadow:-1px 1px 0 #8f42d8,-2px 2px 0 #7f38c8,-3px 3px 0 #6f2eb6,-4px 4px 0 #5f26a2,-5px 5px 0 #4f1f8c,-6px 6px 0 #3f1874,-7px 7px 0 #30125c,0 0 22px #8a4bf0aa,-8px 12px 30px #ec4899aa,8px 10px 30px #3b82f6aa}
.name,.wl{font-family:'Orbitron','Space Grotesk',system-ui,sans-serif;font-weight:900;letter-spacing:.05em;
background:linear-gradient(180deg,#ffffff99 0%,#ffffff33 44%,#ffffff00 46%),repeating-linear-gradient(90deg,#ffffff26 0 1px,transparent 1px 8px),linear-gradient(115deg,#2f6bff 0%,#7a3cff 26%,#d24ff0 48%,#3fa8ff 70%,#8a4bff 88%,#2f6bff 100%);
background-size:100% 100%,auto,220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-text-stroke:2px #eef3ff}
.name{font-size:clamp(24px,7.4vw,50px);animation:nm 2.2s ease-out both,shim2 7s linear infinite}
.wl{font-size:clamp(34px,11vw,72px)}
@keyframes shim2{0%{background-position:0 0,0 0,0 0}100%{background-position:0 0,0 0,-220% 0}}
.name::before,.wl::before{color:#3a2eb0;-webkit-text-fill-color:#3a2eb0;-webkit-text-stroke:2px #cfd8ee;text-shadow:1px 1px 0 #dfe8ff,2px 2px 0 #b9c8f0,3px 3px 0 #8393dc,4px 4px 0 #5f5acc,5px 5px 0 #4d3fbb,6px 6px 0 #3e30a2,7px 7px 0 #30258a,8px 8px 0 #251c72,9px 9px 0 #1b155a,10px 10px 0 #120e44,0 0 24px #7a4bffcc,10px 14px 34px #3b82f6aa,-10px 12px 34px #ec4899aa}
.name,.wl{font-family:'Cinzel Decorative','Cinzel',Georgia,serif;font-weight:700;letter-spacing:.03em;background:linear-gradient(180deg,#fff 0%,#eae5f9 30%,#9f96ca 50%,#f4f0ff 64%,#b9aef0 100%);background-size:100% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-text-stroke:.6px #f7f4ff}
.name::before,.wl::before{content:none}
.name{font-size:clamp(26px,8.2vw,52px);animation:nm 2.2s ease-out both}
.wl{font-size:clamp(38px,12vw,76px)}

main{gap:38px}
.shape{width:min(72vw,300px);padding:2px;font:400 13px var(--sg);letter-spacing:.24em;background:conic-gradient(from var(--a),#7a4bd6,#c4a6ff,#4b7bff,#7a4bd6,#d46bff,#7a4bd6);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);animation:spin 5s linear infinite}
